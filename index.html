<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>iPhone 8-Bit LED 轉 BCD / 16進制即時解析</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h2 { font-size: 1.2rem; margin-bottom: 10px; }
        .video-container {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
        }
        video, canvas {
            width: 100%;
            height: auto;
            border-radius: 12px;
            background: #000;
        }
        /* 隱藏即時處理的 canvas，僅顯示畫面或結果 */
        #outputCanvas { display: none; }
        
        .result-box {
            background: #1e1e1e;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 15px;
            margin: 0 auto;
            max-width: 400px;
        }
        .bits {
            font-family: monospace;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #00ffcc;
            margin: 5px 0;
        }
        .hex {
            font-size: 2rem;
            font-weight: bold;
            color: #ff9900;
        }
        button {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>iPhone 8-Bit LED 辨識器</h2>
    
    <div class="video-container">
        <!-- 關鍵：iOS 必須加上 playsinline 避免強迫全螢幕 -->
        <video id="cameraStream" autoplay playsinline muted></video>
        <canvas id="outputCanvas"></canvas>
    </div>

    <div class="result-box">
        <div>即時位元狀態 (8 Bits):</div>
        <div id="bitDisplay" class="bits">--------</div>
        <div>16 進制結果 (Hex):</div>
        <div id="hexDisplay" class="hex">--</div>
    </div>

    <button id="startBtn">啟動相機</button>

    <script>
        const video = document.getElementById('cameraStream');
        const outputCanvas = document.getElementById('outputCanvas');
        const ctx = outputCanvas.getContext('2d', { willReadFrequently: true });
        
        const bitDisplay = document.getElementById('bitDisplay');
        const hexDisplay = document.getElementById('hexDisplay');
        const startBtn = document.getElementById('startBtn');

        // 點擊按鈕啟動相機（符合 iOS 使用者互動權限規範）
        startBtn.addEventListener('click', async () => {
            try {
                const constraints = {
                    video: {
                        facingMode: { ideal: 'environment' }, // 強制或優先使用 iPhone 後鏡頭
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                startBtn.style.display = 'none'; // 啟動後隱藏按鈕
                
                // 等待影片載入後開始偵測迴圈
                video.onloadedmetadata = () => {
                    outputCanvas.width = video.videoWidth;
                    outputCanvas.height = video.videoHeight;
                    requestAnimationFrame(processVideoFrame);
                };
            } catch (err) {
                alert('無法開啟相機，請確認是否允許權限或使用 HTTPS 連線。錯誤： ' + err.message);
            }
        });

        function processVideoFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // 將當前視訊畫面繪製到 Canvas
                ctx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);

                // 【示範採樣點邏輯】
                // 假設 8 個 LED 橫向排列在畫面的固定相對位置（例如畫面中段、均勻分佈）
                // 實際應用時，你可以依據畫面上的定位點調整這些座標
                let bits = "";
                const yPos = Math.floor(outputCanvas.height / 2); // 取畫面中間高度
                const startX = Math.floor(outputCanvas.width * 0.2);
                const endX = Math.floor(outputCanvas.width * 0.8);
                const step = (endX - startX) / 7;

                for (let i = 0; i < 8; i++) {
                    let xPos = Math.floor(startX + (step * i));
                    
                    // 取得該像素的 RGB 顏色
                    const pixel = ctx.getImageData(xPos, yPos, 1, 1).data;
                    const brightness = (pixel[0] + pixel[1] + pixel[2]) / 3;

                    // 閥值設定為 180（高亮度視為 1，暗視為 0）
                    bits += (brightness > 180) ? "1" : "0";
                }

                // 更新畫面位元顯示
                bitDisplay.innerText = bits;

                // BCD 轉 16 進制運算
                processBCDToHex(bits);
            }

            // 保持每秒 30 格的即時運算
            requestAnimationFrame(processVideoFrame);
        }

        function processBCDToHex(bits) {
            const highNibble = bits.substring(0, 4); // 高 4 位元
            const lowNibble = bits.substring(4, 8);   // 低 4 位元

            const highDec = parseInt(highNibble, 2);
            const lowDec = parseInt(lowNibble, 2);

            // BCD 規範：每 4 位元代表 0~9 的十進制數字
            if (highDec <= 9 && lowDec <= 9) {
                const decimalValue = highDec * 10 + lowDec;
                const hexValue = decimalValue.toString(16).toUpperCase();
                hexDisplay.innerText = `0x${hexValue.padStart(2, '0')}`;
                hexDisplay.style.color = "#ff9900";
            } else {
                hexDisplay.innerText = "非合法 BCD";
                hexDisplay.style.color = "#ff4444";
            }
        }
    </script>
</body>
</html>
